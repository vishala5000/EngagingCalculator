name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper is missing."
            echo "Please commit the Gradle wrapper to the repository."
            exit 1
          fi

      - name: Prepare signing directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/signing"

      - name: Decode permanent signing key
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/signing/release.keystore"

      - name: Generate temporary release key
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        shell: bash
        run: |
          keytool \
            -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/signing/release.keystore" \
            -storepass "TemporaryReleasePassword123!" \
            -keypass "TemporaryReleasePassword123!" \
            -alias "calculator" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Engaging Calculator,O=Vishala,C=IN"

      - name: Configure signing
        shell: bash
        run: |
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/release.keystore" >> "$GITHUB_ENV"

          if [ "${{ secrets.KEYSTORE_BASE64 }}" != "" ]; then
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PASSWORD=TemporaryReleasePassword123!" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=calculator" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=TemporaryReleasePassword123!" >> "$GITHUB_ENV"
          fi

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Clean
        run: ./gradlew clean --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$APKSIGNER" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        shell: bash
        run: |
          cp \
            app/build/outputs/apk/release/app-release.apk \
            EngagingCalculator-v1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EngagingCalculator-v1.0
          path: EngagingCalculator-v1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Engaging Calculator v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: EngagingCalculator-v1.0.apk
