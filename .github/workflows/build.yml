```yaml
name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check Gradle wrapper
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew is missing."
            exit 1
          fi

      - name: Prepare signing directory
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/signing"

      - name: Create or restore release keystore
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using GitHub Actions release keystore."

            echo "$KEYSTORE_BASE64" | base64 --decode \
              > "$GITHUB_WORKSPACE/signing/release.keystore"

            if [ ! -s "$GITHUB_WORKSPACE/signing/release.keystore" ]; then
              echo "ERROR: Keystore decoding failed."
              exit 1
            fi

            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"

          else
            echo "No permanent keystore configured."
            echo "Creating a release keystore for this build."

            keytool \
              -genkeypair \
              -v \
              -keystore "$GITHUB_WORKSPACE/signing/release.keystore" \
              -storepass "TemporaryReleasePassword123!" \
              -keypass "TemporaryReleasePassword123!" \
              -alias "calculator" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Engaging Calculator,O=Vishala,C=IN"

            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=TemporaryReleasePassword123!" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=calculator" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=TemporaryReleasePassword123!" >> "$GITHUB_ENV"
          fi

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x gradlew

      - name: Clean project
        run: |
          ./gradlew clean --no-daemon

      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "Release APK successfully generated:"
          ls -lh "$APK"

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        shell: bash
        run: |
          cp \
            app/build/outputs/apk/release/app-release.apk \
            EngagingCalculator-v1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EngagingCalculator-v1.0
          path: EngagingCalculator-v1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Engaging Calculator v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: EngagingCalculator-v1.0.apk
```
