name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check project files
        shell: bash
        run: |
          echo "======================================"
          echo "PROJECT FILES"
          echo "======================================"

          pwd
          find . -maxdepth 3 -type f | sort

          echo "======================================"
          echo "ANDROID SDK"
          echo "======================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Check Gradle
        shell: bash
        run: |
          gradle --version

      - name: Create automatic release keystore
        shell: bash
        run: |
          mkdir -p signing

          keytool -genkeypair \
            -v \
            -keystore signing/release.keystore \
            -alias engagingcalculator \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass calculator123 \
            -keypass calculator123 \
            -dname "CN=Engaging Calculator,O=Vishala,C=IN"

          echo "Release keystore created."

      - name: Configure automatic signing
        shell: bash
        run: |
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=calculator123" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=engagingcalculator" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=calculator123" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        shell: bash
        run: |
          gradle assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not created."
            exit 1
          fi

          echo "======================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      - name: Find apksigner
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            find "$ANDROID_HOME" \
              -type f \
              -name apksigner \
              -print
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

          echo "Using:"
          echo "$APKSIGNER"

      - name: Verify APK signature
        shell: bash
        run: |
          "$APKSIGNER" verify \
            --verbose \
            app/build/outputs/apk/release/app-release.apk

          echo "======================================"
          echo "SIGNATURE VERIFIED"
          echo "======================================"

      - name: Rename APK
        shell: bash
        run: |
          cp \
            app/build/outputs/apk/release/app-release.apk \
            EngagingCalculator-v1.0.apk

          echo "Final APK:"
          ls -lh EngagingCalculator-v1.0.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: EngagingCalculator-release
          path: EngagingCalculator-v1.0.apk
          if-no-files-found: error
