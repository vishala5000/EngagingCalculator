```yaml
name: Build Android APK

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check Gradle
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew is missing"
            exit 1
          fi

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Create signing directory
        run: mkdir -p signing

      - name: Create release keystore
        run: |
          keytool -genkeypair -v \
            -keystore signing/release.keystore \
            -alias calculator \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass calculator123 \
            -keypass calculator123 \
            -dname "CN=Engaging Calculator,O=Vishala,C=IN"

      - name: Set signing variables
        run: |
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=calculator123" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=calculator" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=calculator123" >> "$GITHUB_ENV"

      - name: Clean
        run: ./gradlew clean --no-daemon

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          echo "APK created successfully"

      - name: Verify Signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk EngagingCalculator-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EngagingCalculator-v1.0
          path: EngagingCalculator-v1.0.apk
```
