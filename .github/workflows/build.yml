```yaml
name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Check Gradle wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew file is missing."
            exit 1
          fi

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Create signing directory
        run: mkdir -p signing

      - name: Create release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore signing/release.keystore \
            -alias calculator \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass calculator123 \
            -keypass calculator123 \
            -dname "CN=Engaging Calculator, O=Vishala, C=IN"

      - name: Set signing environment
        run: |
          echo "KEYSTORE_FILE=${GITHUB_WORKSPACE}/signing/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=calculator123" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=calculator" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=calculator123" >> "$GITHUB_ENV"

      - name: Clean project
        run: ./gradlew clean --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Check APK
        run: |
          if [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cp \
            app/build/outputs/apk/release/app-release.apk \
            EngagingCalculator-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EngagingCalculator-v1.0
          path: EngagingCalculator-v1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Engaging Calculator v1.0.${{ github.run_number }}"
          generate_release_notes: true
          files: EngagingCalculator-v1.0.apk
```
