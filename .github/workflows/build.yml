name: Build Android APK

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version

      - name: Install required Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check project
        run: |
          echo "Checking project files..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew

          echo "Project files OK"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Create signing directory
        run: mkdir -p signing

      - name: Generate release signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore signing/release.keystore \
            -alias calculator \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass calculator123 \
            -keypass calculator123 \
            -dname "CN=Engaging Calculator,O=Vishala,C=IN"

      - name: Configure signing
        run: |
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/signing/release.keystore" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=calculator123" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=calculator" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=calculator123" >> "$GITHUB_ENV"

      - name: Clean project
        run: |
          ./gradlew clean --no-daemon

      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Create final APK
        run: |
          cp \
            app/build/outputs/apk/release/app-release.apk \
            EngagingCalculator-v1.0.apk

          ls -lh EngagingCalculator-v1.0.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: EngagingCalculator-v1.0
          path: EngagingCalculator-v1.0.apk
          if-no-files-found: error
